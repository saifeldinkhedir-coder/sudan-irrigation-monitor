# Theme for both apps. Set here rather than in CSS so Streamlit's own widgets -
# selectboxes, tabs, the sidebar - inherit it instead of fighting it.
[theme]
base = "light"
primaryColor = "#1F7A4D"            # the crop green used for "ok" on the map
backgroundColor = "#FBFAF7"         # warm paper, not clinical white
secondaryBackgroundColor = "#F2EFE8"
textColor = "#1C2321"
font = "sans serif"

[server]
headless = true

# Bind to the loopback interface, not to every interface.
#
# The default binds 0.0.0.0, and Streamlit helpfully prints an "External URL"
# on start - which is what it says it is. This app draws real tenancy
# boundaries, their coordinates, and whatever a farmer has recorded about their
# own land and money. None of that should be reachable from the network because
# somebody ran the app on a laptop in a field office with a public IP.
#
# Override deliberately (--server.address 0.0.0.0) only behind authentication.
address = "127.0.0.1"

[browser]
gatherUsageStats = false
